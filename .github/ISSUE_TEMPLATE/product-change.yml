name: Product / Contract change
description: 提议改变产品原则、API、Schema、证据、持久化或兼容行为。
title: "[Product change] "
labels:
  - needs:triage
  - type:design
  - risk:production
body:
  - type: markdown
    attributes:
      value: |
        此类改动进入施工前必须建立 `manual` Plan，并在需要时更新稳定合同与决定记录。
  - type: textarea
    id: current_contract
    attributes:
      label: 当前原则或合同
      description: 链接当前代码、测试或稳定文档，不以旧 Demo / Fixture 代替现状。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 改变动机与证据
      description: 当前合同为什么不再适用？有哪些真实证据或约束？
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: 建议决定
      description: 说明建议改变什么，以及保留哪些兼容边界。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与取舍
      description: 至少写一个替代方案和没有选择它的原因。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与非目标
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收、迁移与回滚
      description: 写清成功条件、兼容窗口、迁移证据和停止／回滚条件。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与授权
      description: 列出负责人、阻塞 Issue、外部权限和需要人工批准的动作。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 验证方法
      description: Fixture、本地验证、真实服务和生产验证必须分开。
    validations:
      required: true
  - type: checkboxes
    id: approval
    attributes:
      label: Manual Plan 确认
      options:
        - label: 我理解此 Issue 获准讨论不等于获准迁移、发布、付费或处理生产数据。
          required: true
        - label: 我没有提交密钥、真实用户数据、内部地址或未授权素材。
          required: true
