name: V2 Production DB Export

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type export-old-test-data to confirm this backup export
        required: true
      railway_project_id:
        description: Railway project id
        required: true
        default: 942a03f5-84db-414b-86da-a2c9c2c49f48
      postgres_service_id:
        description: Railway Postgres service id
        required: true
        default: 76138dfd-940a-4036-b390-b0bd5f8a3e51
      railway_environment:
        description: Railway environment name
        required: true
        default: production
      retention_days:
        description: Artifact retention days
        required: true
        default: "7"

permissions:
  contents: read

concurrency:
  group: v2-production-db-export
  cancel-in-progress: false

jobs:
  export:
    name: Export old production test database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_PROJECT_ID: ${{ inputs.railway_project_id }}
      POSTGRES_SERVICE_ID: ${{ inputs.postgres_service_id }}
      RAILWAY_ENVIRONMENT: ${{ inputs.railway_environment }}

    steps:
      - name: Refuse missing confirmation
        if: ${{ inputs.confirmation != 'export-old-test-data' }}
        run: |
          echo "confirmation must be exactly export-old-test-data"
          exit 1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Refuse missing Railway API token
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "Repository secret RAILWAY_API_TOKEN is required."
            exit 1
          fi

      - name: Refuse missing backup encryption passphrase
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.PRODUCTION_DB_EXPORT_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_ENCRYPTION_PASSPHRASE:-}" ]; then
            echo "Repository secret PRODUCTION_DB_EXPORT_PASSPHRASE is required."
            exit 1
          fi
          if [ "${#BACKUP_ENCRYPTION_PASSPHRASE}" -lt 24 ]; then
            echo "PRODUCTION_DB_EXPORT_PASSPHRASE must contain at least 24 characters."
            exit 1
          fi
          echo "::add-mask::$BACKUP_ENCRYPTION_PASSPHRASE"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Railway CLI
        run: |
          npm install --global @railway/cli

      - name: Resolve database URL from Railway variables
        id: database_url
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          variables_json="$(railway variable list --project "$RAILWAY_PROJECT_ID" --service "$POSTGRES_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT" --json)"
          database_url="$(printf '%s' "$variables_json" | node tools/extract-railway-database-url.mjs)"
          echo "::add-mask::$database_url"
          echo "value=$database_url" >> "$GITHUB_OUTPUT"

      - name: Export and encrypt database backup
        env:
          DATABASE_URL: ${{ steps.database_url.outputs.value }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.PRODUCTION_DB_EXPORT_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          command -v openssl >/dev/null
          mkdir -p production-db-export
          stamp="$(date -u +'%Y%m%d-%H%M%S')"
          backup_file="production-db-export/${stamp}-shibei-production-old-test-data.dump"
          encrypted_backup_file="${backup_file}.enc"

          docker run --rm \
            -e DATABASE_URL \
            -v "$PWD/production-db-export:/backup" \
            postgres:18 \
            pg_dump "$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-acl \
            --file "/backup/$(basename "$backup_file")"

          openssl enc \
            -aes-256-cbc \
            -salt \
            -pbkdf2 \
            -iter 200000 \
            -md sha256 \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE \
            -in "$backup_file" \
            -out "$encrypted_backup_file"

          rm -f "$backup_file"
          if [ -e "$backup_file" ]; then
            echo "Plaintext database backup still exists; refusing artifact upload."
            exit 1
          fi
          if [ ! -s "$encrypted_backup_file" ]; then
            echo "Encrypted database backup is empty or missing."
            exit 1
          fi

          encrypted_sha="$(sha256sum "$encrypted_backup_file" | awk '{print $1}')"
          encrypted_size="$(wc -c < "$encrypted_backup_file" | tr -d ' ')"
          echo "Encrypted backup ready: sha256=${encrypted_sha} size=${encrypted_size}"

      - name: Upload database export artifact
        uses: actions/upload-artifact@v6
        with:
          name: v2-old-production-test-data-export
          path: production-db-export/*.dump.enc
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
