<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合成 B站学习视频截图</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 390px; height: 844px; overflow: hidden; }
  body { font-family: Arial, "PingFang SC", sans-serif; background: #f7f7f9; color: #18191c; }
  .top { height: 76px; padding: 18px 18px 10px; display: flex; align-items: center; gap: 14px; background: white; }
  .logo { color: #fb7299; font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  .synthetic { font-size: 11px; border: 1px solid #fb7299; color: #fb7299; border-radius: 999px; padding: 4px 8px; }
  .search { margin-left: auto; width: 98px; height: 32px; border-radius: 18px; background: #f1f2f3; color: #9499a0; display: grid; place-items: center; font-size: 12px; }
  .video { margin: 0; height: 300px; position: relative; overflow: hidden; background: linear-gradient(145deg, #19243a, #405b80 58%, #e08da2); }
  .orb { position: absolute; width: 170px; height: 170px; left: 110px; top: 50px; border-radius: 50%; background: rgba(255,255,255,.88); box-shadow: 0 0 55px rgba(255,255,255,.5); }
  .arrow { position: absolute; left: 177px; top: 107px; width: 0; height: 0; border-top: 28px solid transparent; border-bottom: 28px solid transparent; border-left: 43px solid #fb7299; }
  .subtitle { position: absolute; left: 30px; right: 30px; bottom: 43px; color: white; text-align: center; font-weight: 700; font-size: 18px; text-shadow: 0 2px 5px #000; }
  .progress { position: absolute; left: 18px; right: 18px; bottom: 18px; height: 4px; background: rgba(255,255,255,.42); border-radius: 2px; }
  .progress:before { content: ""; display: block; width: 21%; height: 4px; background: #fb7299; border-radius: 2px; }
  .time { position: absolute; bottom: 23px; right: 18px; color: white; font-size: 11px; }
  .content { background: white; padding: 22px 20px 30px; }
  h1 { margin: 0 0 13px; font-size: 22px; line-height: 1.35; }
  .meta { color: #9499a0; font-size: 13px; display: flex; gap: 18px; }
  .author { margin-top: 24px; border-top: 1px solid #eee; padding-top: 20px; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; background: #fbd6e1; display: grid; place-items: center; color: #fb7299; font-weight: 800; }
  .name { font-weight: 700; }
  .tag { color: #9499a0; font-size: 12px; margin-top: 4px; }
  .note { margin-top: 24px; padding: 17px; border-radius: 14px; background: #fff5f8; color: #5d6572; line-height: 1.6; font-size: 14px; }
  .fixture { position: absolute; bottom: 16px; left: 20px; color: #aaa; font-size: 11px; }
</style>
</head>
<body>
  <header class="top"><div class="logo">bilibili</div><div class="synthetic">合成测试</div><div class="search">搜索视频</div></header>
  <section class="video"><div class="orb"></div><div class="arrow"></div><div class="subtitle">主动回忆会暴露记忆缺口</div><div class="time">00:42 / 03:20</div><div class="progress"></div></section>
  <main class="content">
    <h1>主动回忆为什么比直接重读更有效？</h1>
    <div class="meta"><span>1.2万播放</span><span>2026-07-20</span><span>学习方法</span></div>
    <div class="author"><div class="avatar">R</div><div><div class="name">Recallo 测试研究所</div><div class="tag">虚构账号 · 无个人信息</div></div></div>
    <div class="note">先尝试从记忆中提取信息，再查看反馈。这个过程能发现尚未掌握的部分，并帮助安排下一次练习。</div>
  </main>
  <div class="fixture">TEST FIXTURE · NOT A REAL POST</div>
</body>
</html>
