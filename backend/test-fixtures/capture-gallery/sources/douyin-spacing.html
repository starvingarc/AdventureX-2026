<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合成抖音学习视频截图</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 390px; height: 844px; overflow: hidden; }
  body { font-family: Arial, "PingFang SC", sans-serif; background: #090a0d; color: white; }
  .scene { position: absolute; inset: 0; background: radial-gradient(circle at 40% 34%, #415d6d, #17242d 40%, #07090c 80%); }
  .top { position: absolute; top: 18px; left: 18px; right: 18px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .badge { border: 1px solid #25f4ee; color: #25f4ee; border-radius: 999px; padding: 5px 9px; }
  .poster { position: absolute; top: 154px; left: 42px; width: 268px; height: 350px; transform: rotate(-2deg); background: #fff8e7; border-radius: 8px; color: #18242b; box-shadow: 0 18px 50px rgba(0,0,0,.45); padding: 33px 26px; }
  .poster h1 { margin: 0; font-size: 30px; line-height: 1.25; }
  .line { margin-top: 28px; height: 8px; border-radius: 4px; background: #25f4ee; }
  .line.two { width: 74%; background: #fe2c55; }
  .steps { margin-top: 35px; display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
  .day { width: 46px; height: 46px; border: 2px solid #263944; border-radius: 50%; display: grid; place-items: center; }
  .arrow { color: #fe2c55; }
  .side { position: absolute; right: 14px; bottom: 176px; display: grid; gap: 22px; text-align: center; font-size: 11px; }
  .icon { width: 43px; height: 43px; border: 2px solid white; border-radius: 50%; margin-bottom: 5px; display: grid; place-items: center; font-size: 18px; }
  .caption { position: absolute; left: 18px; right: 78px; bottom: 75px; line-height: 1.55; }
  .account { font-weight: 800; margin-bottom: 8px; }
  .topic { font-size: 15px; }
  .music { margin-top: 12px; color: #c9cbd0; font-size: 12px; }
  .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; border-top: 1px solid #292b30; display: flex; align-items: center; justify-content: space-around; background: #090a0d; font-size: 11px; }
  .plus { width: 45px; height: 27px; border-radius: 7px; background: linear-gradient(90deg, #25f4ee 0 25%, white 25% 75%, #fe2c55 75%); color: #111; display: grid; place-items: center; font-weight: 900; }
</style>
</head>
<body>
  <div class="scene"></div>
  <div class="top"><span>推荐</span><span class="badge">抖音 · 合成测试</span><span>搜索</span></div>
  <div class="poster"><h1>间隔练习<br>如何安排？</h1><div class="line"></div><div class="line two"></div><div class="steps"><div class="day">1天</div><span class="arrow">›</span><div class="day">3天</div><span class="arrow">›</span><div class="day">7天</div></div></div>
  <aside class="side"><div><div class="icon">♡</div>0</div><div><div class="icon">◌</div>0</div><div><div class="icon">↗</div>分享</div></aside>
  <div class="caption"><div class="account">@Recallo测试号</div><div class="topic">#学习方法 根据回忆反馈逐步安排 1、3、7 天复习。</div><div class="music">♫ 合成测试音轨 · 无真实用户数据</div></div>
  <nav class="nav"><span>首页</span><span>朋友</span><span class="plus">＋</span><span>消息</span><span>我</span></nav>
</body>
</html>
